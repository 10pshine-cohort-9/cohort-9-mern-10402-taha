$kind: http-request
name: Get All Notes
method: GET
url: '{{baseUrl}}/api/notes'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Response time is less than 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response is an array", function () {
          pm.expect(pm.response.json()).to.be.an("array");
      });

      if (pm.response.json().length > 0) {
          pm.test("Each note has _id", function () {
              pm.response.json().forEach(function(note) {
                  pm.expect(note).to.have.property("_id");
              });
          });

          pm.test("Each note has title", function () {
              pm.response.json().forEach(function(note) {
                  pm.expect(note).to.have.property("title");
              });
          });

          pm.test("Each note has content", function () {
              pm.response.json().forEach(function(note) {
                  pm.expect(note).to.have.property("content");
              });
          });

          pm.test("Each note has user field", function () {
              pm.response.json().forEach(function(note) {
                  pm.expect(note).to.have.property("user");
              });
          });
      }

      if (pm.response.code === 401) {
          pm.test("Status code is 401 for unauthorized", function () {
              pm.response.to.have.status(401);
          });
      }
