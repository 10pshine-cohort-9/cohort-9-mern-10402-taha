$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/api/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "testuser@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Response time is less than 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      if (pm.response.code === 200) {
          pm.test("Status code is 200", function () {
              pm.response.to.have.status(200);
          });

          pm.test("Response has _id", function () {
              pm.expect(pm.response.json()).to.have.property("_id");
          });

          pm.test("Response has name", function () {
              const json = pm.response.json();
              pm.expect(json).to.have.property("name");
              pm.expect(json.name).to.be.a("string");
          });

          pm.test("Response has email", function () {
              const json = pm.response.json();
              pm.expect(json).to.have.property("email");
              pm.expect(json.email).to.be.a("string");
          });

          pm.test("Response has token", function () {
              const json = pm.response.json();
              pm.expect(json).to.have.property("token");
              pm.expect(json.token).to.be.a("string");
          });

          pm.test("Token is valid JWT (3 parts)", function () {
              const json = pm.response.json();
              pm.expect(json.token.split(".").length).to.equal(3);
          });

          const json = pm.response.json();
          if (json.token) {
              pm.collectionVariables.set("authToken", json.token);
              console.log("authToken saved to collection variables");
          }
      }

      if (pm.response.code === 401) {
          pm.test("Status code is 401 for invalid credentials", function () {
              pm.response.to.have.status(401);
          });

          pm.test("Error message is present", function () {
              pm.expect(pm.response.json()).to.have.property("message");
          });

          pm.test("Error message says Invalid credentials", function () {
              pm.expect(pm.response.json().message).to.include("Invalid credentials");
          });
      }
