$kind: http-request
name: Update Note
method: PUT
url: '{{baseUrl}}/api/notes/{{noteId}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "title": "Updated Note Title",
      "content": "This content has been updated."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Response time is less than 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      if (pm.response.code === 200) {
          pm.test("Status code is 200", function () {
              pm.response.to.have.status(200);
          });

          pm.test("Response has _id", function () {
              pm.expect(pm.response.json()).to.have.property("_id");
          });

          pm.test("Title was updated correctly", function () {
              const json = pm.response.json();
              pm.expect(json.title).to.equal("Updated Note Title");
          });

          pm.test("Content was updated correctly", function () {
              const json = pm.response.json();
              pm.expect(json.content).to.equal("This content has been updated.");
          });

          pm.test("Response has updatedAt timestamp", function () {
              pm.expect(pm.response.json()).to.have.property("updatedAt");
          });
      }

      if (pm.response.code === 404) {
          pm.test("Status code is 404 for not found", function () {
              pm.response.to.have.status(404);
          });

          pm.test("Error message is present", function () {
              pm.expect(pm.response.json()).to.have.property("message");
          });
      }

      if (pm.response.code === 401) {
          pm.test("Status code is 401 for unauthorized", function () {
              pm.response.to.have.status(401);
          });
      }
