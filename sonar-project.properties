# SonarQube server
sonar.host.url=http://localhost:9000

# Source directories
sonar.sources=Frontend/src,backend

# Test directories
sonar.tests=Frontend/src,backend/test

# Test file patterns
sonar.test.inclusions=**/*.test.js,**/*.test.jsx

# Exclusions
sonar.exclusions=**/node_modules/**,Frontend/dist/**,**/coverage/**,**/*.test.js,**/*.test.jsx,Frontend/src/__tests__/**,Frontend/src/__mocks__/**

# Coverage reports
sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info,backend/coverage/lcov.info